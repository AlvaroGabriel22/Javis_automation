name: jarvis-local
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina a senha do PostgreSQL no arquivo .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - jarvis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  jarvis-pgdata:
