[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local"
version = "0.6.3"
description = "API local do Jarvis: identidade, contatos e agenda persistente."
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=50,<51", "python-dateutil==2.9.0.post0", "requests>=2.32,<3",
  "neonize==0.10.0", "segno>=1.6,<2", "pillow==13.0.0", "openpyxl==3.1.5",
  "alembic>=1.18,<2", "fastapi>=0.141,<1", "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3", "psycopg[binary]>=3.3,<4",
  "sqlalchemy>=2.0.52,<2.1", "uvicorn>=0.52,<1", "uvloop>=0.22,<1; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["httpx2>=2.13,<3", "pytest>=9,<10", "ruff>=0.17,<1", "pyright>=1.1.414,<2", "setuptools==84.0.0"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.setuptools.package-data]
"jarvis.modules.stickers" = ["assets/*.webp"]
